; KCD1VR targeted distant-object visibility profile. Keep occlusion enabled,
; delay hiding unstable objects, and limit per-object occlusion tests to the
; nearer portion of their configured view distance.
; Launch with:
; +exec KCD1VR.cfg +exec KCD1VR-distant-culling-safe.cfg

e_CheckOcclusion = 1
e_CoverageBuffer = 1
e_OcclusionLazyHideFrames = 8
e_OcclusionCullingViewDistRatio = 0.35
