; KCD1VR Milestone 0 — CryEngine true dual-render stereo.
; Copy this to the Kingdom Come Deliverance game root (two folders above
; KingdomCome.exe) and add this Steam launch option: +exec KCD1VR.cfg

r_StereoMode = 1
r_StereoOutput = 4
r_StereoDevice = 1
r_StereoEyeDist = 0.064
r_StereoFlipEyes = 0
sys_vr_support = 0

; With output mode 4, CryEngine interprets r_Width as ONE EYE's width and
; doubles it when creating the physical side-by-side backbuffer. When DLSS is
; enabled, install.ps1 derives these internal dimensions from the selected
; output resolution and DLSS preset.
r_Width = 1600
r_Height = 1800
r_Fullscreen = 0
r_VSync = 0

; Center-camera fallback. The mod replaces this per eye with the headset FOV.
cl_fov = 90

; Keep the static occlusion mesh (bit 4) but disable reuse/reprojection of the
; previous frame's hardware depth (bits 1 and 2). The stock value 6 combines
; both paths and causes view-dependent object blinking under VR head motion.
e_CoverageBufferReproj = 4

; Screen-space effects commonly need per-eye fixes. Start conservative.
r_MotionBlur = 0
r_DepthOfField = 0
