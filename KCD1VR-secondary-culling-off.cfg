; KCD1VR focused fix candidate. Keep the performance-critical software coverage
; buffer enabled, but disable every other occlusion path from the broad profile.
; Launch with:
; +exec KCD1VR.cfg +exec KCD1VR-secondary-culling-off.cfg

e_CheckOcclusion = 0
e_HwOcclusionCullingObjects = 0
e_TerrainOcclusionCulling = 0
e_OcclusionVolumes = 0
e_RecursionOcclusionCulling = 0
e_ParticlesCullAgainstOcclusionBuffer = 0
e_ShadowsOcclusionCulling = 0
e_ShadowsOcclusionCullingCaster = 0
