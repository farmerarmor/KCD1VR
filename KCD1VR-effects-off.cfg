; KCD1VR diagnostic profile: disable optional rendering passes while retaining
; the core opaque renderer. Do not change graphics settings during this test,
; because a preset can re-enable individual CVars.

; All shadow paths.
e_Shadows = 0
e_ParticlesShadows = 0
e_DynamicDistanceShadows = 0
e_ShadowsPerObject = 0
e_ObjShadowCastSpec = 0
r_DrawNearShadows = 0
r_FogShadows = 0
r_FogShadowsWater = 0
r_ShadowsScreenSpace = 0
r_ShadowsCache = 0
r_ForceAllLightsShadows = 0
r_VolumetricFogShadow = 0
r_VolumetricFogDownscaledSunShadow = 0

; Screen-space, indirect, and secondary-lighting effects.
r_ssdo = 0
r_SSReflections = 0
r_Reflections = 0
r_Refraction = 0
r_ParticlesRefraction = 0
e_TerrainAo = 0
r_TerrainAO = 0
e_GI = 0
e_svoTI_Active = 0
e_svoTI_Apply = 0
r_LightPropagationVolumes = 0
e_LightVolumes = 0
r_DeferredShadingAreaLights = 0
r_DeferredShadingSSS = 0
r_DeferredShading3PL = 0
r_DeferredShadingAmbientLights = 0
r_DeferredShadingEnvProbes = 0

; Post-processing and weather overlays.
r_PostProcessEffects = 0
r_PostProcessFilters = 0
r_PostProcessGameFx = 0
r_MotionBlur = 0
r_DepthOfField = 0
r_HDRBloom = 0
r_sunshafts = 0
r_Beams = 0
r_Flares = 0
r_ColorGrading = 0
r_HDRGrainAmount = 0
r_Sharpening = 0
r_ChromaticAberration = 0
r_Rain = 0
r_RainDropsEffect = 0
e_Clouds = 0

; Material, alpha, geometry, particle, decal, and water extras.
r_DetailTextures = 0
r_SoftAlphaTest = 0
r_TranspDepthFixup = 0
e_VegetationAlphaBlend = 0
r_VegetationAlphaTestOnly = 1
e_Decals = 0
e_DecalsAllowGameDecals = 0
r_DeferredDecals = 0
e_Particles = 0
e_Tessellation = 0
r_ParticlesTessellation = 0
r_WaterTessellationHW = 0
r_WaterReflections = 0
r_WaterCaustics = 0
r_WaterCausticsDeferred = 0
r_WaterGodRays = 0
r_WaterVolumeCaustics = 0

; Keep KCD's required Z prepass enabled; disabling it removes world geometry.
r_UseZPass = 1
r_ZPrepassVegetation = 0
r_ZPassDepthSorting = 0
