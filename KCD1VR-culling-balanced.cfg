; KCD1VR balanced visibility fix. Keep the coverage buffer enabled, but remove
; its temporal reprojection, stop shrinking distant object bounds, and retain
; the rotation safety check.
; Launch with:
; +exec KCD1VR.cfg +exec KCD1VR-culling-balanced.cfg

e_CoverageBuffer = 1
e_CoverageBufferReproj = 0
e_CoverageBufferAABBExpand = 0
e_CoverageBufferRotationSafeCheck = 2
e_CoverageBufferZReprojCamRelative = 1
