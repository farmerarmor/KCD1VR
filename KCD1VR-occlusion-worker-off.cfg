; KCD1VR targeted visibility test. Keep the master occlusion check and coverage
; buffer enabled, but bypass CryEngine's buffered static-object culling worker.
; This is narrower than e_CheckOcclusion=0 and may retain more performance.
; Launch with:
; +exec KCD1VR.cfg +exec KCD1VR-occlusion-worker-off.cfg

e_CheckOcclusion = 1
e_CoverageBuffer = 1
e_StatObjBufferRenderTasks = 0
