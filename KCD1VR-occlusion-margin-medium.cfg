; KCD1VR conservative occlusion test: approximately 2.86 degrees of angular
; AABB safety margin. Keeps the normal buffered visibility worker enabled.
; Launch with:
; +exec KCD1VR.cfg +exec KCD1VR-occlusion-margin-medium.cfg

e_CheckOcclusion = 1
e_CoverageBuffer = 1
e_StatObjBufferRenderTasks = 1
e_CoverageBufferAABBExpand = 0.05
