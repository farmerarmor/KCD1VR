[KCD1VR]
; KCD world units per tracked OpenXR metre.
WorldScale=1.0

; Used only if the headset projection hook is unavailable or disabled.
RenderFovDegrees=90.0

; Widen CryEngine's center camera for visibility and LOD decisions so objects
; are not culled at the outer headset edges. Per-eye OpenXR projection remains
; unchanged. Set 0 to preserve the game's center-camera FOV.
CullingFovDegrees=110.0

; 1 uses the headset's real IPD and asymmetric per-eye field of view.
OpenXRProjection=1

; Monitor-only isolation test. The headset will be blank in modes 1 and 2.
; 0 = normal VR submission
; 1 = OpenXR wait/begin/end pacing with empty frames and no D3D texture copies
; 2 = start the OpenXR session but perform no frame waits or submissions
OpenXRDiagnosticMode=0

; Remove Scaleform UI from the eye textures and show it as a head-locked
; OpenXR quad. Set to 0 to restore the embedded stereo UI.
HudQuad=1
HudDistance=2.0
HudWidth=1.8

; While KCD's explicit dialogue camera is active, show one complete eye as a
; shared, head-locked 2D screen instead of submitting the stereo projection.
; Normal gameplay, menus, and HUD retain the 0.1.64 rendering path.
DialogueScreen=1
DialogueScreenDistance=2.0
DialogueScreenWidth=1.5
; 0 derives the screen aspect from the live per-eye texture, so custom
; resolutions are not distorted. A positive value forces a custom aspect.
DialogueScreenAspect=0

; 1 enables room-scale translation; 0 keeps orientation tracking only.
; HeadTracking=0 disables both headset orientation and position in the game
; camera. This is mainly a diagnostic option; keep it at 1 for normal play.
HeadTracking=1
PositionTracking=1

; Comfort option: prevent mouse/controller vertical look from tilting the game
; camera while preserving full headset pitch. 0 = normal input, 1 = horizontal
; game-camera yaw only.
LockVerticalCameraInput=0

; Test fix for pixel shader 0001919a. The shader's colour, material, normal and
; opacity outputs remain intact; only its per-pixel motion vector is neutralized.
NeutralizeShader1919AMotion=0

; Pixel shader bff18ada is a door material pass whose stereo-incompatible
; previous-position calculation writes bad head-motion vectors.
; 0 = original vectors (recommended with SMAA 1TX),
; 1 = neutral vectors (ghosting), 2 = invalidate history (other flicker).
DoorMotionMode=0

; Shader-browser isolation identified 0025b6ef as KCD's stereo-incompatible SVO
; temporal reprojection pass. This keeps its current-frame SVO lighting and
; spatial filter but bypasses samples from the shared previous-frame history.
BypassSvoTemporalHistory=0

; Diagnostic: log the viewport plus input/output texture identities and sizes
; for the first twelve draws of SVO shader 0025b6ef.
TraceSvoResources=0

; Diagnostic trace for the first twelve draws of door shader bff18ada.
TraceDoorShaderResources=0

; Give SVO shader 0025b6ef independent temporal history for each native-stereo
; eye. Disable this to restore CryEngine's shared, cross-contaminated history.
SeparateSvoHistoryPerEye=1

; Experimental NVIDIA DLSS Super Resolution. The installer replaces the
; output size below with the selected per-eye display resolution and derives
; CryEngine's internal render resolution from the chosen quality preset.
; Quality: 0=Performance, 1=Balanced, 2=Quality, 3=Ultra Performance, 5=DLAA.
DLSS=1
; 1 submits the reconstructed image to OpenXR. Set to 0 to evaluate DLSS
; off-screen while continuing to display the native stereo image.
DLSSSubmit=1
DLSSQuality=2
; DLSS model hint: Default, J, K, L, or M. K prioritizes image quality and is
; the requested comparison against Performance mode's normal M preset.
DLSSRenderPreset=Default
DLSSOutputWidth=1920
DLSSOutputHeight=1080
DLSSDepthInverted=1
; Keep KCD's normal SMAA 1TX output as the DLSS colour input. Raw pre-SMAA
; colour remains available as an experimental comparison but was blurrier in
; headset testing.
DLSSUseRawPreSmaaColor=0
; Multiplier for low-resolution pixel motion submitted to DLSS. 1.0 is the
; contract-correct scale; 0.0 deliberately removes all submitted motion.
DLSSMotionScale=1.0
; Experimental combined color/motion/depth pass. It performed worse on the
; tested D3D11 driver, so leave it disabled.
DLSSReplaceNativeTemporalAA=0
; Detailed D3D11 timestamp queries are useful for diagnosis but add commands
; every frame. Leave disabled for normal play.
DLSSGpuTiming=0
DLSSJitterScaleX=1.0
DLSSJitterScaleY=1.0

; Verified for the current 1.9.7 and 1.9.8 WHGame layout.
PlayerViewVtableRva=0x026C3E10
StereoPrepareCameraRva=0x02056F24
CameraSetFrustumRva=0x0030099C
CameraUpdateFrustumRva=0x00300B30
FlashRenderRva=0x002E3858
DialogueCameraVtableRva=0x026B3820
FlashPlayerVtableRva=0x021BC500
FlashPlayerRenderProxyVtableRva=0x021BC4D8
StereoLeftTextureRva=0x02FFE9D0
StereoRightTextureRva=0x02FFE9C8
