; KCD1VR diagnostic: disable CPU/GPU object-visibility systems that can remove
; complete draw calls before the shader browser sees them. Performance may be
; substantially lower. Launch with:
; +exec KCD1VR.cfg +exec KCD1VR-culling-off.cfg

e_CheckOcclusion = 0
e_CoverageBuffer = 0
e_HwOcclusionCullingObjects = 0
e_TerrainOcclusionCulling = 0
e_OcclusionVolumes = 0
e_RecursionOcclusionCulling = 0
e_ParticlesCullAgainstOcclusionBuffer = 0
e_ShadowsOcclusionCulling = 0
e_ShadowsOcclusionCullingCaster = 0
