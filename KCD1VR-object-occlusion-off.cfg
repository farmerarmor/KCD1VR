; KCD1VR isolation profile. Leave the master visibility check and software
; coverage buffer enabled, but disable the remaining whole-object occluders.
; Launch with:
; +exec KCD1VR.cfg +exec KCD1VR-object-occlusion-off.cfg

e_HwOcclusionCullingObjects = 0
e_TerrainOcclusionCulling = 0
e_OcclusionVolumes = 0
e_RecursionOcclusionCulling = 0
